<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0c101b"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>

  <!-- Bold Gold 'FJ' Typography -->
  <text 
    x="64" 
    y="70" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#f59e0b" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="64" 
    letter-spacing="-1">FJ</text>
</svg>